# Dependabot version updates for every ecosystem in this repository, with a 7-day cooldown.

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly
   cooldown:
     default-days: 7
 - package-ecosystem: "cargo"
   directory: "/"
   schedule:
     interval: weekly
   cooldown:
     default-days: 7
   groups:
     all:
       patterns: ["*"]
 - package-ecosystem: "cargo"
   directory: "/fuzz"
   schedule:
     interval: weekly
   cooldown:
     default-days: 7
   groups:
     all:
       patterns: ["*"]
 - package-ecosystem: "github-actions"
   directory: "/"
   schedule:
     interval: weekly
   cooldown:
     default-days: 7
 - package-ecosystem: "npm"
   directory: "/"
   schedule:
     interval: weekly
   cooldown:
     default-days: 7
   ignore:
     # Pulumi's peer range is typescript < 7, and its bundled ts-node needs the JavaScript API
     # that TypeScript 7 (the native compiler) does not have.
     - dependency-name: "typescript"
       versions: [">=7.0.0"]
   groups:
     all:
       patterns: ["*"]
