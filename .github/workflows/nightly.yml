name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Least privilege: no job here writes to the repository, so the token is read-only.
permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  # Early warning for toolchain bumps: the full pipeline on current stable.
  stable-toolchain:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned toolchain's targets (rust-toolchain.toml) are not on a bare `stable`, and the
      # `no-std` and `wasm` steps of `ci` need them.
      - run: rustup toolchain install stable --target thumbv7em-none-eabihf --target wasm32-unknown-unknown --target wasm32-wasip1 && rustup override set stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest,cargo-deny,wasmtime
      # The full `ci` includes `fuzz-build`, which is strict under `CI`, so it needs these two.
      - run: rustup toolchain install "$(cargo xtask fuzz-toolchain)" --profile minimal
      - run: cargo install --locked cargo-fuzz
      - run: cargo xtask ci

  # Property tests at 100,000 cases each (the default is 256). Some failures only show at this
  # depth, such as float-tolerance bugs, so this is where the next one gets caught. A failing
  # run uploads the shrunk counterexamples that proptest saves.
  deep-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "100000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo xtask test --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: proptest-regressions
          path: "**/*.proptest-regressions"

  # Coverage-guided fuzzing of engine_handle: every target for 10 minutes. A finding fails the job
  # and uploads the crash input; the corpus is cached between runs so coverage accumulates. The
  # job is deliberately not `continue-on-error`: a red run is how a finding becomes visible.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - run: rustup toolchain install "$(cargo xtask fuzz-toolchain)" --profile minimal
      # install-action has no cargo-fuzz manifest, so build it from source (the cache keeps it).
      - run: cargo install --locked cargo-fuzz
      # A per-run key with a prefix restore gives a rolling cache: each run starts from the newest
      # corpus and saves its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: cargo xtask fuzz all
      # Separate from the restore step because the combined action saves only when the job
      # succeeds, and the runs that find a crash are the ones whose corpus is worth keeping.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 30

  os-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo xtask clippy
      - run: cargo xtask test
