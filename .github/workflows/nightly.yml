name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  # Early warning for toolchain bumps: the full pipeline on current stable.
  stable-toolchain:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable && rustup override set stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,wasmtime
      - run: cargo xtask ci

  # Property tests at 100,000 cases each (the default is 256). Some failures only show at this
  # depth, such as float-tolerance bugs, so this is where the next one gets caught. A failing
  # run uploads the shrunk counterexamples that proptest saves.
  deep-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "100000"
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo xtask test --release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: proptest-regressions
          path: "**/*.proptest-regressions"

  os-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo xtask clippy
      - run: cargo xtask test
