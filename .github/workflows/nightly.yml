name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Least privilege: no job here writes to the repository, so the token is read-only.
permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  # Early warning for toolchain bumps: the full pipeline on current stable.
  stable-toolchain:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install stable && rustup override set stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest,cargo-deny,wasmtime
      - run: cargo xtask ci

  # Property tests at 100,000 cases each (the default is 256). Some failures only show at this
  # depth, such as float-tolerance bugs, so this is where the next one gets caught. A failing
  # run uploads the shrunk counterexamples that proptest saves.
  deep-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROPTEST_CASES: "100000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo xtask test --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: proptest-regressions
          path: "**/*.proptest-regressions"

  os-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - run: cargo xtask clippy
      - run: cargo xtask test
