name: CodeQL

# Code scanning for the workflows (`actions`) and the Rust code, in advanced setup: this file, not
# the repository's default setup, which must stay off (GitHub rejects the upload while it is on).
# Report-only: alerts appear in the Security tab and annotate pull requests, and no merge waits on
# this workflow (it is not a required check).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, clear of the nightly run (06:00) and mutants (Sundays)

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the analysis job adds one scope, below.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
