name: Feature request
description: Propose an engine feature, an unmeasured performance idea, or a change to an API or a design decision
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is an experimental engine and some decisions are deliberately deferred (see [the roadmap](https://github.com/SpencerAWill/rust-engine-experiment/blob/main/docs/roadmap.md)). Please open an issue before writing a large change. For CI, tooling or repository work, use the **Infrastructure or chore** form; for a question, start a discussion.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Done when
      description: The outcome that would count as done, so the issue can be scheduled.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How it is verified
      description: A command, a test or a named check that proves it. If it needs a measurement first, say so.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      description: Issues or chunks (for example `#40`, `M3.8`) that must land first.

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Does it change a public API, a frozen format (PRNG streams, `UntypedGenId::to_bits`), or a policy (`unsafe`, determinism, no global state)? Those need an ADR.

  - type: checkboxes
    id: assistant
    attributes:
      label: Drafting
      options:
        - label: An assistant drafted this issue.
