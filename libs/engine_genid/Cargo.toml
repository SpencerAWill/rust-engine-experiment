[package]
name = "engine_genid"
description = "Typed generational IDs, a dense ID-addressed map, and an ID allocator"
keywords = ["id", "generational", "arena", "gamedev", "no-std"]
categories = ["data-structures", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes `check_invariants` to integration tests.
test-invariants = []

[dev-dependencies]
proptest = { workspace = true }
dhat = "0.3"
# Self dev-dependency: enables `test-invariants` for integration tests even without --all-features
# (the wasm CI step runs `cargo test` without it).
engine_genid = { path = ".", features = ["test-invariants"] }

[lints]
workspace = true
