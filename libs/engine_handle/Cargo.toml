[package]
name = "engine_handle"
description = "Typed generational handles, a dense handle-addressed pool, and a handle allocator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Exposes `assert_invariants` to integration tests.
test-invariants = []

[dev-dependencies]
proptest = { workspace = true }
# Self dev-dependency: enables `test-invariants` for integration tests even without --all-features
# (the wasm CI step runs `cargo test` without it).
engine_handle = { path = ".", features = ["test-invariants"] }

[lints]
workspace = true
