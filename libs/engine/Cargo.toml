[package]
name = "engine"
description = "Facade for the engine: one dependency that re-exports the handle, random, time, and math crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Forwarded to the leaf crates that have a `std` feature (enables `SystemClock`).
std = ["engine_time/std"]

[dependencies]
engine_handle = { workspace = true }
engine_random = { workspace = true }
engine_time = { workspace = true }
engine_math = { workspace = true }

[lints]
workspace = true
