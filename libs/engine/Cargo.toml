[package]
name = "engine"
description = "The engine library: generational IDs, deterministic collections, random numbers, simulation time and math"
keywords = ["gamedev", "simulation", "determinism"]
categories = ["game-engines"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["std"]
# Enables `time::SystemClock` and `std` as the transcendental backend of `math::scalar`.
std = ["glam/std"]
# Exposes `check_invariants` on `GenIdMap` and `GenIdAllocator` to integration tests and fuzz targets.
test-invariants = []

[dependencies]
indexmap = { workspace = true }
foldhash = { workspace = true }
glam = { workspace = true }
libm = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
dhat = "0.3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rand_xoshiro = "0.8.1"
# Self dev-dependency: enables `test-invariants` for integration tests even without --all-features
# (the wasm CI step runs `cargo test` without it).
engine = { path = ".", features = ["test-invariants"] }

[[bench]]
name = "time_fixed_timestep"
harness = false

[lints]
workspace = true
