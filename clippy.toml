allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is randomized per process; use engine_collections::IndexMap" },
  { path = "std::collections::HashSet", reason = "iteration order is randomized per process; use engine_collections::IndexSet" },
  { path = "std::hash::RandomState",    reason = "OS-seeded; breaks same-build determinism" },
  { path = "indexmap::IndexMap", reason = "with indexmap's `std` feature (enabled in the workspace by other dependencies) its default hasher is std's RandomState, which the RandomState ban does not catch through a defaulted type parameter; use engine_collections" },
  { path = "indexmap::IndexSet", reason = "with indexmap's `std` feature (enabled in the workspace by other dependencies) its default hasher is std's RandomState, which the RandomState ban does not catch through a defaulted type parameter; use engine_collections" },
  { path = "foldhash::fast::RandomState", reason = "randomly seeded; breaks same-build determinism" },
  { path = "foldhash::quality::RandomState", reason = "randomly seeded; breaks same-build determinism" },
  { path = "foldhash::HashMap", reason = "randomly seeded; use engine_collections::IndexMap" },
  { path = "foldhash::HashSet", reason = "randomly seeded; use engine_collections::IndexSet" },
]
