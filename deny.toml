[advisories]
version = 2
[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
[bans]
multiple-versions = "warn"
# Competing ECS libraries are measurement baselines only (M3.10): each may be used by its spike
# baseline crate and nothing else (spikes/README.md, Rules).
deny = [
    { crate = "bevy_ecs", wrappers = ["spike_ecs_bevy"] },
    { crate = "hecs", wrappers = ["spike_ecs_hecs"] },
]
[sources]
unknown-registry = "deny"
unknown-git = "deny"
